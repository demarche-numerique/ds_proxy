[package]
name = "ds_proxy"
version = "0.1.0"
authors = ["simon lehericey <mail@simon.lehericey.net>"]
edition = "2024"
build = "build.rs" # Cargo only supports one build script per project at the moment
rust-version = "1.93.1"
license = "AGPL-3.0-only"
description = "DS Proxy is an S3 and Swift compatible streaming encryption HTTP proxy"

[dependencies]
libsodium-rs = "*"
futures = "*"
actix-web = { version="*", features = ["openssl"] }
awc = { version = "*", features = ["openssl"] }
actix-files = "*"
docopt = "*"
serde = { version = "*", features = ["derive"] }
serde_with = { version = "*", features = ["base64"] }
toml = "*"
log = "*"
env_logger = { version = "*", default-features = false, features = ["auto-color", "humantime"] }
sentry = { version = "*", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "release-health", "ureq", "native-tls"] }
url = "*"
base64 = "*"
tokio = { version = "*", features = ["fs", "io-util"] }
chrono = { version = "*", default-features = false, features = ["now"] }
hex = "*"
deadpool-redis = { version = "*", features = ["tokio-native-tls-comp"] }
openssl = "*"
md-5 = "*"
sha2 = "*"
aws-credential-types = "*"
aws-sigv4 = "*"
async-stream = "*"

[dev-dependencies]
assert_cmd = "*"
assert_fs = "*"
actix-rt = "*"
proptest = "*"
serial_test = "*"
serde_json = "*"
uuid = { version = "*", features = ["v4"] }
tempfile = "*"
